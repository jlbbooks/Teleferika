# This is the main pubspec.yaml file
# The setup scripts will modify this file based on the selected flavor

name: teleferika
description: "TeleferiKa app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.3.4+108

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.1"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  # Licensed features package (will be added/removed by setup scripts)
  # DO NOT REMOVE THE NEXT LINE!!!
  # LICENSED_PACKAGE_PLACEHOLDER
  licensed_features_package:
    path: ../licensed_features_package

  compassx: ^1.0.1
  crypto: ^3.0.8
  csv: ^8.0.0
  cupertino_icons: ^1.0.8
  device_info_plus: ^13.3.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.14
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_map_compass: ^1.1.1
  flutter_map_location_marker: ^10.3.0
  flutter_map_tile_caching: ^10.1.1
  geolocator: ^14.1.2
  http: ^1.6.0
  image_picker: ^1.2.4
  # Direct deps so we can enable Android Photo Picker in main.dart (Play policy).
  image_picker_android: ^0.8.13+25
  image_picker_platform_interface: ^2.8.0
  intl: ^0.20.3
  latlong2: ^0.9.1
  logging: ^1.3.0
  lottie: ^3.7.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  pointycastle: ^4.0.0
  provider: ^6.1.5+1
  archive: ^4.5.2
  asn1lib: ^1.6.8
  reorderable_grid_view: ^2.2.8
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  url_launcher: ^6.3.3
  # Patched fork of 0.5.2: jcenter() removed for Gradle 9 (see third_party/usb_serial).
  usb_serial:
    path: third_party/usb_serial
  uuid: ^4.6.0
  xml: ^7.1.0
  flutter_svg: ^2.3.2
  restart_app: ^1.10.2

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_lints: any #^6.0.0
  flutter_test:
    sdk: flutter

# package_info_plus / share_plus / device_info_plus / geolocator 14.1 need win32 ^6.
# file_picker 13 brings windows_file_picker which is compatible.
# drift_dev still declares build <5; build 5.0 is the republished 4.1 API required by build_runner 2.17.
# vector_graphics_compiler still caps xml at 7.0.1; 7.1 is API-compatible for our SVG/KML use.
dependency_overrides:
  # shapekit 0.3.x pins sqlite3 ^2 for GeoPackage; drift_flutter needs ^3.
  sqlite3: ^3.0.0
  win32: ^6.4.0
  build: ^5.0.0
  xml: ^7.1.0

flutter:
  generate: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/animations/
