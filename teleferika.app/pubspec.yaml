# This is the main pubspec.yaml file
# The setup scripts will modify this file based on the selected flavor

name: teleferika
description: "TeleferiKa app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.3.0+102

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.1"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  # Licensed features package (will be added/removed by setup scripts)
  # DO NOT REMOVE THE NEXT LINE!!!
  # LICENSED_PACKAGE_PLACEHOLDER
  licensed_features_package:
    path: ../licensed_features_package

  compassx: ^1.0.1
  crypto: ^3.0.7
  csv: ^7.1.0
  cupertino_icons: ^1.0.8
  device_info_plus: ^13.3.0
  drift: ^2.31.0
  drift_flutter: ^0.2.4
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.14
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_map_compass: ^1.1.1
  flutter_map_location_marker: ^10.3.0
  flutter_map_tile_caching: ^10.1.1
  geolocator: ^14.1.1
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: ^0.9.1
  logging: ^1.3.0
  lottie: ^3.6.1
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.1
  pointycastle: ^4.0.0
  provider: ^6.1.5+1
  asn1lib: ^1.6.5
  reorderable_grid_view: ^2.2.8
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+2
  url_launcher: ^6.3.3
  usb_serial: ^0.5.2
  uuid: ^4.6.0
  xml: ^6.5.0
  flutter_svg: ^2.3.0

dev_dependencies:
  build_runner: ^2.11.1
  drift_dev: ^2.31.0
  flutter_lints: any #^6.0.0
  flutter_test:
    sdk: flutter

# package_info_plus / share_plus / device_info_plus / geolocator 14.1 need win32 ^6.
# file_picker 13 brings windows_file_picker which is compatible.
dependency_overrides:
  win32: ^6.4.0

flutter:
  generate: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/animations/
